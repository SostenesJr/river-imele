<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>NavLog Amazônia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NavLog">
<link rel="stylesheet" href="css/style.css">
<style>html:not(.authed) body { visibility: hidden; }</style>
<script>
(function () {
  // Aplica o tema salvo (claro/escuro) ANTES da página pintar, senão dava
  // pra ver um "flash" com o tema errado por uma fração de segundo assim
  // que a página abre. Preferência de cada aparelho (localStorage), não é
  // um dado da empresa — por isso não vem do Supabase.
  try {
    var t = localStorage.getItem('navlog-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) { /* modo privado etc. — segue no tema padrão */ }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  // document.body pode ainda não existir aqui (estamos no <head>) —
  // por isso a classe vai na <html>, que já existe, em vez de mexer
  // direto no <body>.
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { document.documentElement.classList.add('authed'); }
    else { window.location.replace('/login.html'); }
  }).catch(function () { window.location.replace('/login.html'); });
})();
if ('serviceWorker' in navigator) {
  // Quando uma versão nova do app é publicada, o service worker antigo é
  // trocado pelo novo automaticamente — mas sem isso aqui, a aba já aberta
  // continuava rodando o JS/CSS antigos (carregados em memória) até a
  // pessoa fechar e abrir o app de novo. Com esse aviso, a página recarrega
  // sozinha assim que o novo service worker assume, então a correção chega
  // na hora. "sw-reloaded" evita entrar num loop de recarregamento.
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (sessionStorage.getItem('sw-reloaded')) return;
    sessionStorage.setItem('sw-reloaded', '1');
    window.location.reload();
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
}
</script>
</head>
<body>

<div id="hdr">
  <div class="dot"></div>
  <div>
    <div class="lt">NAVLOG AMAZÔNIA</div>
  </div>
  <div class="hdr-right">
    <div class="htabs">
      <button class="htab on" data-s="r" onclick="SS('r',this)"><span class="hti">📋</span><span data-i18n="tab_rotas">Rotas</span></button>
      <button class="htab" data-s="i" onclick="SS('i',this)"><span class="hti">🛳️</span><span data-i18n="tab_info">Informações</span></button>
      <button class="htab" data-s="m" onclick="SS('m',this)"><span class="hti">🗺️</span><span data-i18n="tab_mapa">Mapa</span></button>
      <button class="htab" data-s="n" onclick="SS('n',this)"><span class="hti">🌊</span><span data-i18n="tab_noticias">Notícias</span></button>
      <button class="htab htab-icon" data-s="c" onclick="SS('c',this)" title="Configurações" data-i18n-title="tab_config"><span class="hti">⚙️</span></button>
    </div>
    <span class="live-dot" id="live-dot" title="Conectando..."></span>
    <span class="user-badge" id="user-badge"></span>
    <div class="lang-wrap">
      <button class="theme-btn" id="lang-btn" onclick="toggleLangMenu(event)" title="Trocar idioma" data-i18n-title="lang_btn_title">PT</button>
      <div class="lang-menu" id="lang-menu"></div>
    </div>
    <button class="theme-btn" id="theme-btn" onclick="alternarTema()" title="Trocar tema claro/escuro" data-i18n-title="theme_btn_title">☀️</button>
    <button class="logout-btn" onclick="sair()" title="Sair" data-i18n-title="logout_title">⏻</button>
  </div>
</div>

<div id="btabs">
  <div class="brow">
    <button class="btab on" id="bt-r" onclick="SS('r',null)"><span class="bti">📋</span><span data-i18n="tab_rotas">Rotas</span></button>
    <button class="btab" id="bt-i" onclick="SS('i',null)"><span class="bti">🛳️</span><span data-i18n="tab_info">Informações</span></button>
    <button class="btab" id="bt-m" onclick="SS('m',null)"><span class="bti">🗺️</span><span data-i18n="tab_mapa">Mapa</span></button>
    <button class="btab" id="bt-n" onclick="SS('n',null)"><span class="bti">🌊</span><span data-i18n="tab_noticias">Notícias</span></button>
    <button class="btab btab-icon" id="bt-c" onclick="SS('c',null)" title="Configurações" data-i18n-title="tab_config"><span class="bti">⚙️</span></button>
  </div>
</div>

<div id="app">

  <!-- ROTAS -->
  <div class="scr" id="sc-r">
    <div class="hero-banner">
      <div class="hero-banner-tt" data-i18n="hero_title">Rotas fluviais do Amazonas</div>
      <div class="hero-banner-sb" id="hero-sub">10 calhas · 57 municípios</div>
    </div>
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="rsearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fR(this.value)">
      </div>
    </div>
    <div class="rbdy" id="rbdy"></div>
  </div>

  <!-- INFORMAÇÕES (somente leitura) -->
  <div class="scr h" id="sc-i">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="isearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fINFO(this.value)">
      </div>
    </div>
    <div class="rbdy" id="ibdy"></div>
  </div>

  <!-- CONFIGURAÇÕES (editável) -->
  <div class="scr h" id="sc-c">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="csearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fC(this.value)">
      </div>
    </div>
    <div class="rbdy" id="cbdy"></div>
  </div>

  <!-- MAPA -->
  <div class="scr h scr-map" id="sc-m">
    <div id="map-toolbar">
      <div id="map-filters"></div>
      <div class="map-zoomctl">
        <button class="mcb" onclick="zI()">+</button>
        <button class="mcb" onclick="zO()">−</button>
        <button class="mcb" onclick="zR()">⟳</button>
      </div>
    </div>
    <div id="map-wrap">
      <svg id="msvg" viewBox="0 0 900 600" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

  <!-- NOTÍCIAS: nível do Rio Negro (referência Porto de Manaus) + feed -->
  <div class="scr h" id="sc-n">
    <div class="rbdy" id="nbdy"></div>
  </div>

</div>

<!-- BOTTOM SHEET: reaproveitado pelo balão somente-leitura (Informações)
     e pelo balão editável (Configurações) -->
<div id="sheet-overlay" onclick="fecharSheet(event)">
  <div id="sheet" onclick="event.stopPropagation()">
    <div class="shdl"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>initApp();</script>
</body>
</html>
