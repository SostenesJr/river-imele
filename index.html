<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>NavLog Amazônia</title>
<link rel="stylesheet" href="css/style.css">
<style>html:not(.authed) body { visibility: hidden; }</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  // document.body pode ainda não existir aqui (estamos no <head>) —
  // por isso a classe vai na <html>, que já existe, em vez de mexer
  // direto no <body>.
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { document.documentElement.classList.add('authed'); }
    else { window.location.replace('/login.html'); }
  }).catch(function () { window.location.replace('/login.html'); });
})();
</script>
</head>
<body>

<div id="hdr">
  <div class="dot"></div>
  <div>
    <div class="lt">NAVLOG AMAZÔNIA</div>
  </div>
  <div class="hdr-right">
    <div class="htabs">
      <button class="htab on" data-s="r" onclick="SS('r',this)"><span class="hti">📋</span>Rotas</button>
      <button class="htab" data-s="i" onclick="SS('i',this)"><span class="hti">🛳️</span>Informações</button>
      <button class="htab" data-s="m" onclick="SS('m',this)"><span class="hti">🗺️</span>Mapa</button>
      <button class="htab htab-icon" data-s="c" onclick="SS('c',this)" title="Configurações"><span class="hti">⚙️</span></button>
    </div>
    <span class="live-dot" id="live-dot" title="Conectando..."></span>
    <span class="user-badge" id="user-badge"></span>
    <button class="logout-btn" onclick="sair()" title="Sair">⏻</button>
  </div>
</div>

<div id="btabs">
  <div class="brow">
    <button class="btab on" id="bt-r" onclick="SS('r',null)"><span class="bti">📋</span>Rotas</button>
    <button class="btab" id="bt-i" onclick="SS('i',null)"><span class="bti">🛳️</span>Informações</button>
    <button class="btab" id="bt-m" onclick="SS('m',null)"><span class="bti">🗺️</span>Mapa</button>
    <button class="btab btab-icon" id="bt-c" onclick="SS('c',null)" title="Configurações"><span class="bti">⚙️</span></button>
  </div>
</div>

<div id="app">

  <!-- ROTAS -->
  <div class="scr" id="sc-r">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="rsearch" placeholder="Buscar município ou código..." oninput="fR(this.value)">
      </div>
    </div>
    <div class="rbdy" id="rbdy"></div>
  </div>

  <!-- INFORMAÇÕES (somente leitura) -->
  <div class="scr h" id="sc-i">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="isearch" placeholder="Buscar município ou código..." oninput="fINFO(this.value)">
      </div>
    </div>
    <div class="rbdy" id="ibdy"></div>
  </div>

  <!-- CONFIGURAÇÕES (editável) -->
  <div class="scr h" id="sc-c">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="csearch" placeholder="Buscar município ou código..." oninput="fC(this.value)">
      </div>
    </div>
    <div class="rbdy" id="cbdy"></div>
  </div>

  <!-- MAPA -->
  <div class="scr h scr-map" id="sc-m">
    <div id="map-toolbar">
      <div id="map-filters"></div>
      <div class="map-zoomctl">
        <button class="mcb" onclick="zI()">+</button>
        <button class="mcb" onclick="zO()">−</button>
        <button class="mcb" onclick="zR()">⟳</button>
      </div>
    </div>
    <div id="map-wrap">
      <svg id="msvg" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>

</div>

<!-- BOTTOM SHEET: reaproveitado pelo balão somente-leitura (Informações)
     e pelo balão editável (Configurações) -->
<div id="sheet-overlay" onclick="fecharSheet(event)">
  <div id="sheet" onclick="event.stopPropagation()">
    <div class="shdl"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>initApp();</script>
</body>
</html>
