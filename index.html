<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>NavLog Amazônia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NavLog">
<link rel="stylesheet" href="css/style.css">
<!-- Leaflet: motor do mapa real (tiles OpenStreetMap/CartoDB, zoom/pan de
     verdade) — ver README, seção "Mapa real (Leaflet + tiles)". -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<style>html:not(.authed) body { visibility: hidden; }</style>
<script>
(function () {
  // Aplica o tema salvo (claro/escuro) ANTES da página pintar, senão dava
  // pra ver um "flash" com o tema errado por uma fração de segundo assim
  // que a página abre. Preferência de cada aparelho (localStorage), não é
  // um dado da empresa — por isso não vem do Supabase.
  try {
    var t = localStorage.getItem('navlog-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) { /* modo privado etc. — segue no tema padrão */ }
})();
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  // document.body pode ainda não existir aqui (estamos no <head>) —
  // por isso a classe vai na <html>, que já existe, em vez de mexer
  // direto no <body>.
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) { document.documentElement.classList.add('authed'); }
    else { window.location.replace('/login.html'); }
  }).catch(function () { window.location.replace('/login.html'); });
})();
if ('serviceWorker' in navigator) {
  // Quando uma versão nova do app é publicada, o service worker antigo é
  // trocado pelo novo automaticamente — mas sem isso aqui, a aba já aberta
  // continuava rodando o JS/CSS antigos (carregados em memória) até a
  // pessoa fechar e abrir o app de novo. Com esse aviso, a página recarrega
  // sozinha assim que o novo service worker assume, então a correção chega
  // na hora. "sw-reloaded" evita entrar num loop de recarregamento.
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (sessionStorage.getItem('sw-reloaded')) return;
    sessionStorage.setItem('sw-reloaded', '1');
    window.location.reload();
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
}
</script>
</head>
<body>

<!-- Barra de navegação lateral — única (mesma no celular e no desktop),
     fixa na lateral esquerda o tempo todo, em cima de nenhum conteúdo (o
     resto do app é empurrado com margin-left, ver #app). Reúne tudo que
     antes ficava espalhado entre o cabeçalho de cima (desktop) e o menu de
     abas embaixo (celular): as 6 abas, idioma, notificações, tema e sair. -->
<div id="hdr">
  <div class="hdr-top">
    <div class="dot"></div>
    <div class="lt">NAVLOG AMAZÔNIA</div>
  </div>

  <div class="htabs">
    <span class="htab-pill" id="htab-pill"></span>
    <button class="htab on" data-s="r" onclick="SS('r',this)"><span class="hti">📋</span><span data-i18n="tab_rotas">Rotas</span></button>
    <button class="htab" data-s="i" onclick="SS('i',this)"><span class="hti">🛳️</span><span data-i18n="tab_info">Informações</span></button>
    <button class="htab" data-s="m" onclick="SS('m',this)"><span class="hti">🗺️</span><span data-i18n="tab_mapa">Mapa</span></button>
    <button class="htab" data-s="n" onclick="SS('n',this)"><span class="hti">🌊</span><span data-i18n="tab_noticias">Notícias</span></button>
    <button class="htab" data-s="w" onclick="SS('w',this)"><span class="hti">🌤️</span><span data-i18n="tab_clima">Clima</span></button>
    <button class="htab" data-s="c" onclick="SS('c',this)" title="Configurações" data-i18n-title="tab_config"><span class="hti">⚙️</span><span data-i18n="tab_config">Configurações</span></button>
  </div>

  <div class="hdr-bottom">
    <span class="live-dot" id="live-dot" title="Conectando..."></span>
    <span class="user-badge" id="user-badge"></span>
    <div class="lang-wrap">
      <button class="theme-btn" id="lang-btn" onclick="toggleLangMenu(event)" title="Trocar idioma" data-i18n-title="lang_btn_title">PT</button>
      <div class="lang-menu" id="lang-menu"></div>
    </div>
    <button class="theme-btn" id="push-btn" onclick="togglePush()" title="Ativar notificações" data-i18n-title="push_btn_title_off">🔕</button>
    <button class="theme-btn" id="theme-btn" onclick="alternarTema()" title="Trocar tema claro/escuro" data-i18n-title="theme_btn_title">☀️</button>
    <button class="logout-btn" onclick="sair()" title="Sair" data-i18n-title="logout_title">⏻</button>
  </div>
</div>

<div id="app">

  <!-- ROTAS -->
  <div class="scr" id="sc-r">
    <div class="hero-banner">
      <div class="hero-banner-tt" data-i18n="hero_title">Rotas fluviais do Amazonas</div>
      <div class="hero-banner-sb" id="hero-sub">10 calhas · 57 municípios</div>
    </div>
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="rsearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fR(this.value)">
      </div>
    </div>
    <div class="rbdy" id="rbdy">
      <!-- skeleton: some sozinho assim que bRO() roda e troca o innerHTML pela lista de verdade -->
      <div class="skel-card"></div><div class="skel-card"></div><div class="skel-card"></div>
      <div class="skel-card"></div><div class="skel-card"></div>
    </div>
  </div>

  <!-- INFORMAÇÕES (somente leitura) -->
  <div class="scr h" id="sc-i">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="isearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fINFO(this.value)">
      </div>
    </div>
    <div class="rbdy" id="ibdy"></div>
  </div>

  <!-- CONFIGURAÇÕES (editável) -->
  <div class="scr h" id="sc-c">
    <div class="rhdr">
      <div class="rsw">
        <span class="rsi">🔍</span>
        <input type="text" id="csearch" placeholder="Buscar município ou código..." data-i18n-ph="search_ph" oninput="fC(this.value)">
      </div>
    </div>
    <div class="rbdy" id="cbdy"></div>
  </div>

  <!-- MAPA -->
  <div class="scr h scr-map" id="sc-m">
    <div id="map-wrap">
      <div id="msvg"></div>
      <!-- Botão flutuante: abre/fecha a gaveta lateral com os filtros e as
           ferramentas do mapa (ver toggleMapToolbar() em js/app.js) — antes
           essa barra ficava fixa em cima, ocupando altura do mapa o tempo
           todo; agora fica escondida, reativa só ao clique. -->
      <button id="map-toolbar-toggle" class="map-toolbar-toggle" onclick="toggleMapToolbar()" title="Filtros e ferramentas do mapa" data-i18n-title="map_toolbar_toggle_title">☰</button>
      <div id="map-toolbar">
        <div id="map-filters"></div>
        <div class="map-zoomctl">
          <button class="mcb" onclick="abrirRotaCalc()" title="Distância entre dois municípios" data-i18n-title="rota_calc_btn_title">🧭</button>
          <button class="mcb" onclick="toggleTileEstilo()" id="btn-tile-estilo" title="Alternar mapa claro/escuro" data-i18n-title="tile_toggle_title">🌗</button>
          <button class="mcb" onclick="zI()">+</button>
          <button class="mcb" onclick="zO()">−</button>
          <button class="mcb" onclick="zR()">⟳</button>
        </div>
      </div>
      <div id="map-regime-legend" class="h" onclick="SS('n',null)"></div>
      <div id="map-radar-ctl"></div>
    </div>
  </div>

  <!-- NOTÍCIAS: nível do Rio Negro (referência Porto de Manaus) + feed -->
  <div class="scr h" id="sc-n">
    <div class="rbdy" id="nbdy">
      <!-- skeleton: some sozinho assim que bNIVEL() roda e troca o innerHTML pelo card de verdade -->
      <div class="skel-card" style="height:210px"></div>
      <div class="skel-card" style="height:130px"></div>
    </div>
  </div>

  <!-- CLIMA: clima atual + qualidade do ar de todos os municípios (Open-Meteo) -->
  <div class="scr h" id="sc-w">
    <div id="climabdy">
      <!-- skeleton: some sozinho assim que bCLIMA() roda (buscou o clima da Open-Meteo com sucesso ou deu erro) -->
      <div class="clima-grid">
        <div class="skel-card" style="height:120px"></div><div class="skel-card" style="height:120px"></div>
        <div class="skel-card" style="height:120px"></div><div class="skel-card" style="height:120px"></div>
        <div class="skel-card" style="height:120px"></div><div class="skel-card" style="height:120px"></div>
      </div>
    </div>
  </div>

</div>

<!-- BOTTOM SHEET: reaproveitado pelo balão somente-leitura (Informações)
     e pelo balão editável (Configurações) -->
<div id="sheet-overlay" onclick="fecharSheet(event)">
  <div id="sheet" onclick="event.stopPropagation()">
    <div class="shdl"></div>
    <div id="sheet-body"></div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script>initApp();</script>
</body>
</html>
