<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d11">
<title>Login · NavLog Amazônia</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NavLog">
<link rel="stylesheet" href="css/style.css">
<script>
(function () {
  // Mesmo tema (claro/escuro) que o resto do app, salvo no aparelho —
  // aplicado antes da página pintar pra não dar "flash" trocando de tema.
  try {
    var t = localStorage.getItem('navlog-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  } catch (e) { /* modo privado etc. */ }
})();
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.addEventListener('controllerchange', function () {
    if (sessionStorage.getItem('sw-reloaded')) return;
    sessionStorage.setItem('sw-reloaded', '1');
    window.location.reload();
  });
  window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js'); });
}
</script>
<style>
  html, body { overflow: auto; }
  body {
    display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
    background: var(--bg); position: relative; isolation: isolate;
  }
  /* fundo com zoom lento contínuo ("Ken Burns") — fica num pseudo-elemento
     separado do body pra poder animar o transform sem mexer no layout/scroll. */
  body::before {
    content: ''; position: fixed; inset: -20px; z-index: -1;
    background:
      linear-gradient(180deg, rgba(10,19,16,.55), rgba(10,19,16,.88) 70%, rgba(10,19,16,.97)),
      var(--hero-img) center 40% / cover no-repeat;
    animation: kenBurns 24s ease-in-out infinite alternate;
    transform-origin: center;
  }
  @keyframes kenBurns { from { transform: scale(1.05); } to { transform: scale(1.16); } }
  .login-box {
    width: 100%; max-width: 340px; padding: 28px;
    background: color-mix(in srgb, var(--s1) 82%, transparent);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--bd); border-radius: 16px;
    box-shadow: 0 20px 60px -15px rgba(0,0,0,.6);
  }
  .login-box.login-in { animation: loginIn .55s cubic-bezier(.2,.8,.2,1) backwards; }
  @keyframes loginIn { from { opacity: 0; transform: translateY(16px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .login-box.shake { animation: loginShake .4s ease; }
  @keyframes loginShake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {
    body::before { animation: none !important; }
    .login-box.login-in, .login-box.shake { animation: none !important; }
  }
  .login-logo { text-align: center; margin-bottom: 22px; }
  .login-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ac); box-shadow: 0 0 8px var(--ac); margin: 0 auto 10px; }
  .login-title { font-size: 15px; font-weight: 800; letter-spacing: .08em; }
  .login-sub { font-size: 10px; color: var(--gold); font-weight: 900; letter-spacing: .04em; margin-top: 3px; }
  .login-field { margin-top: 18px; }
  .login-field label { display: block; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--mu); margin-bottom: 6px; }
  .login-field input { width: 100%; background: var(--bg); border: 1px solid var(--bd); border-radius: 8px; padding: 12px; color: var(--tx); font-size: 15px; outline: none; font-family: var(--font-sans); }
  .login-field input:focus { border-color: var(--ac); }
  .login-btn { width: 100%; margin-top: 20px; background: var(--ac); color: #fff; border: none; border-radius: 9px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: var(--font-sans); }
  .login-btn:disabled { opacity: .6; cursor: default; }
  .login-err { color: var(--re); font-size: 12px; margin-top: 12px; text-align: center; display: none; }
  .login-hint { color: var(--mu); font-size: 11px; margin-top: 16px; text-align: center; line-height: 1.5; }
  .login-lang { position: fixed; top: 14px; right: 14px; }
  .login-lang button { width: 34px; height: 34px; border-radius: 8px; background: color-mix(in srgb, var(--s1) 82%, transparent); border: 1px solid var(--bd); color: var(--tx); font-size: 11px; font-weight: 800; cursor: pointer; font-family: var(--font-sans); }
</style>
</head>
<body>
  <div class="login-lang lang-wrap">
    <button id="lang-btn" onclick="toggleLangMenu(event)" title="Trocar idioma" data-i18n-title="lang_btn_title">PT</button>
    <div class="lang-menu" id="lang-menu"></div>
  </div>
  <div class="login-box login-in" id="login-box">
    <div class="login-logo">
      <div class="login-dot"></div>
      <div class="login-title">NAVLOG AMAZÔNIA</div>
    </div>
    <form id="login-form">
      <div class="login-field">
        <label data-i18n="login_email_label">E-mail</label>
        <input type="email" id="in-email" autocomplete="username" autofocus required>
      </div>
      <div class="login-field">
        <label data-i18n="login_senha_label">Senha</label>
        <input type="password" id="in-senha" autocomplete="current-password" required>
      </div>
      <button type="submit" class="login-btn" id="btn-entrar" data-i18n="login_btn">Entrar</button>
      <div class="login-err" id="login-err">E-mail ou senha incorretos.</div>
    </form>
    <div class="login-hint" data-i18n-html="login_hint_html">Sua conta é criada pelo administrador do sistema.<br>Não tem acesso ainda? Fale com quem administra o NavLog.</div>
  </div>

<script src="js/i18n.js"></script>
<script>setIdiomaEstatico(idiomaSalvo());</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script>
(function () {
  // se já tem sessão válida, pula direto pro app
  sb.auth.getSession().then(function (res) {
    if (res.data && res.data.session) window.location.replace('/index.html');
  });
})();

function balancarLoginBox() {
  var box = document.getElementById('login-box'); if (!box) return;
  box.classList.remove('shake');
  void box.offsetWidth; // reinicia a animação mesmo se já tinha rodado
  box.classList.add('shake');
}

document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var btn = document.getElementById('btn-entrar');
  var err = document.getElementById('login-err');
  var email = document.getElementById('in-email').value.trim();
  var senha = document.getElementById('in-senha').value;
  btn.disabled = true; btn.textContent = t('login_entering');
  err.style.display = 'none';

  sb.auth.signInWithPassword({ email: email, password: senha }).then(function (res) {
    if (res.error) {
      err.textContent = t('login_err_credentials');
      err.style.display = 'block';
      btn.disabled = false; btn.textContent = t('login_btn');
      balancarLoginBox();
      return;
    }
    window.location.href = '/index.html';
  }).catch(function () {
    err.textContent = t('login_err_connection');
    err.style.display = 'block';
    btn.disabled = false; btn.textContent = t('login_btn');
    balancarLoginBox();
  });
});
</script>
</body>
</html>
